# Upstream for the benchmark: fixed JSON answers, so the backend is never the bottleneck.
worker_processes auto;
events { worker_connections 4096; }
http {
  access_log off;
  default_type application/json;
  keepalive_requests 1000000;
  server {
    listen 80;
    location = /ping   { return 200 '{"status":"ok","service":"backend","version":"1.0.0"}'; }
    location = /user   { return 200 '{"id":42,"name":"Ada Lovelace","email":"ada@example.com","active":true,"roles":["admin","dev"]}'; }
    # reflects the X-Bench-Req request header, so a request modifier can be verified
    location = /echo   { return 200 '{"bench_req":"$http_x_bench_req"}'; }
    location = /orders { return 200 '{"orders":[{"id":1,"total":19.99,"items":3},{"id":2,"total":5.5,"items":1},{"id":3,"total":120,"items":8}],"count":3}'; }
  }
}
